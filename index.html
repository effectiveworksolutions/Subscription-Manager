<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>SubTracker</title>
<meta name="theme-color" content="#0a0a0f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="SubTracker"/>
<meta name="mobile-web-app-capable" content="yes"/>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230a0a0f'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%237c3aed'/%3E%3Cstop offset='100%25' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='256' y='350' font-family='Arial Black' font-size='360' font-weight='900' fill='url(%23g)' text-anchor='middle'%3E%24%3C/text%3E%3C/svg%3E"/>
<link rel="manifest" href="data:application/json,{%22name%22:%22SubTracker%22,%22short_name%22:%22SubTracker%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230a0a0f%22,%22theme_color%22:%22%230a0a0f%22,%22icons%22:[{%22src%22:%22data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230a0a0f'/%3E%3Ctext x='256' y='350' font-family='Arial Black' font-size='360' font-weight='900' fill='%23a855f7' text-anchor='middle'%3E%24%3C/text%3E%3C/svg%3E%22,%22sizes%22:%22512x512%22,%22type%22:%22image/svg+xml%22,%22purpose%22:%22any maskable%22}]}"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#0a0a0f;--surface:#141420;--surface2:#1e1e2e;--surface3:#252538;
  --border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.15);
  --text:#f0f0f8;--text-muted:#8888aa;--text-faint:#55556a;
  --accent:#7c3aed;--accent-bright:#a855f7;--accent-light:rgba(124,58,237,0.15);--accent-text:#c084fc;
  --warn:#f59e0b;--warn-light:rgba(245,158,11,0.12);
  --danger:#f87171;--danger-light:rgba(248,113,113,0.12);
  --success:#34d399;--success-light:rgba(52,211,153,0.12);
  --r:14px;--r-sm:9px;--shadow:0 4px 24px rgba(0,0,0,0.5);
  --nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}

html{height:100%}
body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  min-height:100%;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(124,58,237,0.08) 0%,transparent 55%),
                   radial-gradient(ellipse at 80% 100%,rgba(168,85,247,0.04) 0%,transparent 55%);
}

/* ── SHARED ── */
.badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.03em}
.badge-active{background:var(--success-light);color:var(--success)}
.badge-trial{background:var(--warn-light);color:var(--warn)}
.badge-paused{background:rgba(255,255,255,0.05);color:var(--text-faint)}
.badge-cancelled{background:var(--danger-light);color:var(--danger)}

.next-pay{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:500;margin-top:5px}
.next-pay-count{font-size:10px;font-weight:700;padding:1px 5px;border-radius:20px}
.next-pay-urgent{background:rgba(248,113,113,0.1);color:var(--danger)}
.next-pay-urgent .next-pay-count{background:var(--danger);color:#0a0a0f}
.next-pay-soon{background:rgba(245,158,11,0.1);color:var(--warn)}
.next-pay-soon .next-pay-count{background:var(--warn);color:#0a0a0f}
.next-pay-ok{background:rgba(52,211,153,0.08);color:var(--success)}
.next-pay-ok .next-pay-count{background:var(--success);color:#0a0a0f}
.next-pay-far{background:var(--surface2);color:var(--text-muted)}
.next-pay-far .next-pay-count{background:var(--surface3);color:var(--text-muted)}
.next-pay-paused{background:var(--surface2);color:var(--text-faint)}

.sub-icon{border-radius:12px;background:var(--surface3);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border);flex-shrink:0}
.sub-icon svg{width:100%;height:100%;border-radius:11px;display:block}
.sub-icon .icon-fallback{font-size:20px}

.empty{text-align:center;padding:4rem 1rem;color:var(--text-muted);font-size:15px}
.empty svg{margin:0 auto 14px;display:block;color:var(--text-faint)}

/* metric cards */
.metric{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-bright));opacity:.7}
.metric-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.metric-value{font-family:'Bebas Neue',sans-serif;color:var(--text);line-height:1;letter-spacing:1px}
.metric-sub{font-size:11px;color:var(--text-muted);margin-top:4px}

/* form elements */
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px}
.form-row input,.form-row select{width:100%;height:44px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none}
.form-row input:focus,.form-row select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.form-row select option{background:var(--surface2)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.renew-display{height:44px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface3);font-size:13px;color:var(--text-faint);display:flex;align-items:center}
.or-divider{display:flex;align-items:center;gap:10px;color:var(--text-faint);font-size:11px;margin:12px 0}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}

/* service picker */
.service-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;max-height:190px;overflow-y:auto;padding:2px}
.service-tile{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);cursor:pointer;transition:all .15s;text-align:center}
.service-tile:hover,.service-tile.selected{border-color:var(--accent-bright);background:var(--accent-light)}
.service-tile.selected{box-shadow:0 0 0 1px var(--accent)}
.service-tile .tile-brand-svg{width:56px;height:26px}
.service-tile .tile-brand-svg svg{width:100%;height:100%;border-radius:4px;display:block}
.service-tile .tile-emoji{font-size:22px;line-height:28px}
.service-tile span{font-size:9px;color:var(--text-faint);line-height:1.2;word-break:break-word}
.service-tile.selected span{color:var(--accent-text);font-weight:600}

/* ═══════════════════════════════════════════
   MOBILE LAYOUT  (default, < 700px)
═══════════════════════════════════════════ */
#mobile-ui{display:flex;flex-direction:column;height:100vh;height:100dvh}
#desktop-ui{display:none}

.top-bar{flex-shrink:0;padding:0 16px;padding-top:max(14px,var(--safe-t));padding-bottom:12px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top-bar h1{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px;background:linear-gradient(135deg,#f0f0f8 40%,var(--accent-bright));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.top-bar-actions{display:flex;gap:8px;align-items:center}
.fab{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-bright));border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(124,58,237,.45);transition:transform .15s}
.fab:active{transform:scale(.93)}
.icon-btn-top{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);transition:background .15s}
.icon-btn-top:active{background:var(--surface2)}

.m-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 14px 0;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 14px)}

.m-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.m-summary .metric{padding:12px 10px}
.m-summary .metric-value{font-size:1.5rem}

.search-row{display:flex;gap:10px;margin-bottom:10px;align-items:center}
.search-wrap{position:relative;flex:1}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
.search-wrap input{width:100%;height:44px;padding:0 14px 0 40px;border-radius:22px;border:1px solid var(--border);background:var(--surface);font-family:'Inter',sans-serif;font-size:15px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
.search-wrap input::placeholder{color:var(--text-faint)}

.chips-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.chips-row::-webkit-scrollbar{display:none}
.chip{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--border);background:var(--surface);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);white-space:nowrap;cursor:pointer;transition:all .15s;flex-shrink:0}
.chip.active{border-color:var(--accent-bright);background:var(--accent-light);color:var(--accent-text)}

.section-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;padding-left:2px}

.m-sub-list{display:flex;flex-direction:column;gap:10px}
.m-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;display:flex;align-items:flex-start;gap:13px;cursor:pointer;transition:border-color .2s}
.m-card:active{border-color:rgba(124,58,237,.4);background:var(--surface2)}
.m-card .sub-icon{width:48px;height:48px}
.m-card-body{flex:1;min-width:0}
.m-card-name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-card-meta{font-size:12px;color:var(--text-faint);margin-top:1px}
.m-card-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.price-main{font-size:15px;font-weight:600;color:var(--text)}
.price-per{font-size:10px;color:var(--text-faint)}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-b));background:rgba(14,14,22,.95);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:6px;padding-bottom:var(--safe-b);z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;color:var(--text-faint);font-size:10px;font-weight:500;letter-spacing:.04em;border:none;background:none;font-family:'Inter',sans-serif;transition:color .15s}
.nav-item.active{color:var(--accent-text)}
.nav-item:active svg{transform:scale(.88)}

/* ═══════════════════════════════════════════
   DESKTOP LAYOUT  (≥ 700px)
═══════════════════════════════════════════ */
@media(min-width:700px){
  #mobile-ui{display:none}
  #desktop-ui{display:block;max-width:860px;margin:0 auto;padding:2.5rem 1.5rem 3rem}

  .d-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2rem}
  .d-header h1{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:3px;background:linear-gradient(135deg,#f0f0f8 40%,var(--accent-bright));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
  .d-header p{font-size:13px;color:var(--text-faint);margin-top:5px}
  .d-btn-add{height:42px;padding:0 22px;background:linear-gradient(135deg,var(--accent),var(--accent-bright));color:#fff;border:none;border-radius:var(--r-sm);font-family:'Inter',sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:0 2px 12px rgba(124,58,237,.35);transition:opacity .15s,box-shadow .15s}
  .d-btn-add:hover{opacity:.9;box-shadow:0 4px 20px rgba(124,58,237,.5)}

  .d-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:2rem}
  .d-summary .metric{padding:1.2rem 1.4rem}
  .d-summary .metric-value{font-size:2.2rem}

  .d-toolbar{display:flex;gap:10px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
  .d-search-wrap{position:relative;flex:1;min-width:180px}
  .d-search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-faint);pointer-events:none}
  .d-search-wrap input{width:100%;height:40px;padding:0 14px 0 38px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
  .d-search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.15)}
  .d-search-wrap input::placeholder{color:var(--text-faint)}
  select.d-filter{height:40px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font-family:'Inter',sans-serif;font-size:13px;color:var(--text);padding:0 12px;cursor:pointer;outline:none;transition:border-color .2s}
  select.d-filter:focus{border-color:var(--accent)}
  select.d-filter option{background:var(--surface2)}

  .d-list{display:flex;flex-direction:column;gap:9px}
  .d-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);transition:border-color .2s,transform .15s,box-shadow .2s;cursor:pointer}
  .d-card:hover{border-color:rgba(124,58,237,.4);transform:translateY(-2px);box-shadow:var(--shadow),0 0 0 1px rgba(124,58,237,.1),0 0 20px rgba(124,58,237,.12)}
  .d-card .sub-icon{width:46px;height:46px}
  .d-card-info{flex:1;min-width:0}
  .d-card-name{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .d-card-meta{font-size:13px;color:var(--text-muted);margin-top:2px}
  .d-card-pay{font-size:12px;color:var(--text-faint);margin-top:1px}
  .d-card-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .d-price{text-align:right}
  .d-icon-btn,.d-icon-link{background:none;border:none;cursor:pointer;color:var(--text-faint);padding:6px;border-radius:7px;display:flex;align-items:center;transition:color .15s,background .15s;text-decoration:none}
  .d-icon-btn:hover,.d-icon-link:hover{color:var(--accent-text);background:var(--accent-light)}

  .d-section-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);margin-bottom:12px;padding-left:2px}
}

/* ── SHEETS (shared by both) ── */
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(5px);z-index:200;align-items:flex-end;justify-content:center}
.sheet-overlay.open{display:flex}
@media(min-width:700px){
  .sheet-overlay{align-items:center}
  .sheet{border-radius:18px !important;max-width:520px;margin:0 auto}
}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;border:1px solid var(--border-strong);border-bottom:none;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 20px;padding-bottom:calc(20px + var(--safe-b));box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:slideUp .28s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:700px){.sheet{animation:fadeIn .2s ease}}
@keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border-strong);margin:14px auto 20px}
@media(min-width:700px){.sheet-handle{display:none}}
.sheet-title{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:2px;color:var(--text);margin-bottom:18px}
.sheet-actions{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.btn-save{flex:1;height:50px;background:linear-gradient(135deg,var(--accent),var(--accent-bright));border:none;border-radius:25px;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(124,58,237,.4)}
.btn-save:active{opacity:.85}
.btn-cancel-s{height:50px;padding:0 20px;background:var(--surface2);border:1px solid var(--border-strong);border-radius:25px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text-muted);cursor:pointer}
.btn-delete-s{height:50px;padding:0 18px;background:var(--danger-light);border:none;border-radius:25px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--danger);cursor:pointer}

/* detail sheet */
.detail-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.detail-icon{width:60px;height:60px;border-radius:14px;background:var(--surface3);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--border);flex-shrink:0}
.detail-icon svg{width:100%;height:100%;border-radius:13px;display:block}
.detail-name{font-size:20px;font-weight:600;color:var(--text)}
.detail-cat{font-size:13px;color:var(--text-faint);margin-top:2px}
.detail-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border);font-size:14px}
.detail-row:last-of-type{border-bottom:none}
.detail-label{color:var(--text-muted)}
.detail-value{color:var(--text);font-weight:500;text-align:right;max-width:60%}
.detail-actions{display:flex;gap:10px;margin-top:18px}
.btn-edit{flex:1;height:50px;background:linear-gradient(135deg,var(--accent),var(--accent-bright));border:none;border-radius:25px;font-family:'Inter',sans-serif;font-size:15px;font-weight:600;color:#fff;cursor:pointer}
.btn-link{height:50px;padding:0 18px;background:var(--surface2);border:1px solid var(--border-strong);border-radius:25px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text-muted);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px}

/* filter sheet */
.filter-section{margin-bottom:18px}
.filter-section-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px}
.option-pills{display:flex;flex-wrap:wrap;gap:8px}
.opt-pill{height:36px;padding:0 16px;border-radius:18px;border:1px solid var(--border);background:var(--surface2);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all .15s}
.opt-pill.active{border-color:var(--accent-bright);background:var(--accent-light);color:var(--accent-text)}

/* iOS tip */
#ios-tip{display:none;position:fixed;bottom:calc(var(--nav-h) + var(--safe-b));left:0;right:0;z-index:300;background:var(--surface2);border-top:1px solid rgba(124,58,237,.3);padding:14px 20px;text-align:center;box-shadow:0 -8px 32px rgba(0,0,0,.5)}
@media(min-width:700px){#ios-tip{bottom:0}}
</style>
</head>
<body>

<!-- ═══ MOBILE UI ═══ -->
<div id="mobile-ui">
  <div class="top-bar">
    <div><h1>SubTracker</h1></div>
    <div class="top-bar-actions">
      <button class="icon-btn-top" onclick="openFilter()" title="Filter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      </button>
      <button class="fab" onclick="openAdd()">

// ── HELPERS ───────────────────────────────────────────────────────────────
function isMobile(){return window.innerWidth<700}
function nextRenewalDate(sd,cy){
  if(!sd)return null;const now=new Date();now.setHours(0,0,0,0);
  let d=new Date(sd);
  if(cy==='yearly'){while(d<=now)d.setFullYear(d.getFullYear()+1)}
  else{while(d<=now)d.setMonth(d.getMonth()+1)}
  return d;
}
function daysUntil(d){if(!d)return 9999;const n=new Date();n.setHours(0,0,0,0);return Math.ceil((d-n)/86400000)}
function toMonthly(s){return s.cycle==='yearly'?s.price/12:s.price}
function fmtDate(d){return d?d.toLocaleDateString('en-AU',{month:'short',day:'numeric'}):'—'}
function logoHtml(name,emoji){const svg=BRAND_SVGS[name];return svg||`<span class="icon-fallback">${emoji||'📦'}</span>`}
function getSvc(name){return SERVICE_LIBRARY.find(s=>s.name.toLowerCase()===name.toLowerCase())||null}

function nextPayHtml(s){
  if(s.status==='paused'||s.status==='cancelled')
    return`<div class="next-pay next-pay-paused"><span class="next-pay-count">${s.status}</span></div>`;
  if(!s.startDate)
    return`<div class="next-pay next-pay-paused"><span class="next-pay-count">no date</span></div>`;
  const rd=nextRenewalDate(s.startDate,s.cycle),days=daysUntil(rd);
  let cls,cnt;
  if(days===0){cls='urgent';cnt='today'}
  else if(days<=3){cls='urgent';cnt=`in ${days}d`}
  else if(days<=7){cls='soon';cnt=`in ${days}d`}
  else if(days<=30){cls='ok';cnt=`in ${days}d`}
  else{cls='far';cnt=`in ${days}d`}
  return`<div class="next-pay next-pay-${cls}">$${s.price.toFixed(2)} · ${fmtDate(rd)}<span class="next-pay-count">${cnt}</span></div>`;
}

function badgeHtml(status){
  const m={active:'badge-active',trial:'badge-trial',paused:'badge-paused',cancelled:'badge-cancelled'};
  return`<span class="badge ${m[status]||'badge-paused'}">${status}</span>`;
}

// ── SUMMARY ───────────────────────────────────────────────────────────────
function renderSummary(){
  const active=subs.filter(s=>s.status==='active'||s.status==='trial');
  const monthly=active.reduce((a,s)=>a+toMonthly(s),0);
  const yearly=active.reduce((a,s)=>a+(s.cycle==='yearly'?s.price:s.price*12),0);
  const dueSoon=active.filter(s=>{const d=daysUntil(nextRenewalDate(s.startDate,s.cycle));return d>=0&&d<=7}).length;
  const html=`
    <div class="metric"><div class="metric-label">Monthly</div><div class="metric-value">$${monthly.toFixed(2)}</div><div class="metric-sub">${active.length} active</div></div>
    <div class="metric"><div class="metric-label">Annual</div><div class="metric-value">$${Math.round(yearly).toLocaleString()}</div><div class="metric-sub">excl. paused</div></div>
    <div class="metric"><div class="metric-label">Due soon</div><div class="metric-value">${dueSoon}</div><div class="metric-sub">within 7 days</div></div>`;
  const ms=document.getElementById('m-summary'),ds=document.getElementById('d-summary');
  if(ms)ms.innerHTML=html;if(ds)ds.innerHTML=html;
}

// ── FILTERED LIST ─────────────────────────────────────────────────────────
function getFiltered(){
  const mq=document.getElementById('m-search')?.value.toLowerCase()||'';
  const dq=document.getElementById('d-search')?.value.toLowerCase()||'';
  const q=isMobile()?mq:dq;
  const fs=isMobile()?filterStatus:(document.getElementById('d-status')?.value||'all');
  const fc=isMobile()?filterCycle:(document.getElementById('d-cycle')?.value||'all');
  const sb=isMobile()?sortBy:(document.getElementById('d-sort')?.value||'renewal');
  const STATUS_ORDER={active:0,trial:1,paused:2,cancelled:3};
  return subs.filter(s=>
    (!q||s.name.toLowerCase().includes(q)||(s.paymentMethod||'').toLowerCase().includes(q))&&
    (fs==='all'||s.status===fs)&&(fc==='all'||s.cycle===fc)
  ).sort((a,b)=>{
    if(sb==='name')return a.name.localeCompare(b.name);
    if(sb==='status'){const d=(STATUS_ORDER[a.status]??9)-(STATUS_ORDER[b.status]??9);return d||a.name.localeCompare(b.name)}
    if(sb==='cost-asc')return toMonthly(a)-toMonthly(b);
    if(sb==='cost-desc')return toMonthly(b)-toMonthly(a);
    return daysUntil(nextRenewalDate(a.startDate,a.cycle))-daysUntil(nextRenewalDate(b.startDate,b.cycle));
  });
}

    </div>

    <div class="form-row"><label>Next renewal (auto)</label><div class="renew-display" id="renew-preview">Enter start date to calculate</div></div>
    <div class="form-row"><label>Payment method</label><input id="f-payment" type="text" value="${s.paymentMethod||''}" placeholder="e.g. ANZ Visa, PayPal"/></div>
    <div class="form-row"><label>Website URL (optional)</label><input id="f-url" type="url" value="${s.url||''}" placeholder="https://..."/></div>
    <div class="form-row"><label>Notes (optional)</label><input id="f-notes" type="text" value="${s.notes||''}" placeholder="e.g. Family plan"/></div>
    <div class="sheet-actions">
      ${editId?`<button class="btn-delete-s" onclick="deleteSub(${editId})">Delete</button>`:''}
      <button class="btn-cancel-s" onclick="closeForm()">Cancel</button>
      <button class="btn-save" onclick="saveSub()">Save</button>
    </div>`;
  if(preIdx>=0){document.querySelectorAll('.service-tile')[preIdx]?.classList.add('selected');selectedService=preIdx}
  updRenew();
  document.getElementById('form-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-name')?.focus(),300);
}

function closeForm(){document.getElementById('form-overlay').classList.remove('open');selectedService=null}

function saveSub(){
  const name=document.getElementById('f-name').value.trim();
  const price=parseFloat(document.getElementById('f-price').value);
  if(!name||isNaN(price)||price<0){alert('Please enter a name and price.');return}
  let emoji=null;
  if(selectedService!==null)emoji=SERVICE_LIBRARY[selectedService]?.emoji;
  else if(editId)emoji=subs.find(s=>s.id===editId)?.emoji;
  if(!emoji)emoji=getSvc(name)?.emoji||null;
  let url=document.getElementById('f-url').value.trim();
  if(!url)url=getSvc(name)?.url||'';
  const sub={
    id:editId||nextId++,name,price,emoji,
    cycle:document.getElementById('f-cycle').value,
    category:document.getElementById('f-cat').value,
    status:document.getElementById('f-status').value,
    startDate:document.getElementById('f-start').value,
    paymentMethod:document.getElementById('f-payment').value.trim(),
    url,notes:document.getElementById('f-notes').value.trim(),
  };
  subs=editId?subs.map(s=>s.id===editId?sub:s):[...subs,sub];
  save();closeForm();render();
}

function deleteSub(id){
  if(!confirm('Delete this subscription?'))return;
  subs=subs.filter(s=>s.id!==id);save();closeForm();closeDetail();render();
}
