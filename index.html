  &quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%230a0a0f'/%3E%3Crect x='0' y='0' width='512' height='3' fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient id='g'%3E%3Cstop offset='0%25' stop-color='%237c3aed'/%3E%3Cstop offset='100%25' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='256' y='320' font-family='Arial' font-size='280' font-weight='900' fill='%23a855f7' text-anchor='middle'%3E%24%3C/text%3E%3C/svg%3E&quot;,&quot;sizes&quot;:&quot;512x512&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;,&quot;purpose&quot;:&quot;any maskable&quot;}]

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #141420;
    --surface2: #1e1e2e;
    --surface3: #252538;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.15);
    --text: #f0f0f8;
    --text-muted: #8888aa;
    --text-faint: #55556a;
    --accent: #7c3aed;
    --accent-bright: #a855f7;
    --accent-light: rgba(124,58,237,0.15);
    --accent-text: #c084fc;
    --warn: #f59e0b;
    --warn-light: rgba(245,158,11,0.12);
    --danger: #f87171;
    --danger-light: rgba(248,113,113,0.12);
    --success: #34d399;
    --success-light: rgba(52,211,153,0.12);
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 4px 24px rgba(0,0,0,0.5), 0 1px 4px rgba(0,0,0,0.4);
    --glow: 0 0 20px rgba(124,58,237,0.15);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2.5rem 1rem;
    background-image: radial-gradient(ellipse at 20% 0%, rgba(124,58,237,0.08) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 100%, rgba(168,85,247,0.05) 0%, transparent 60%);
  }

  .app { max-width: 800px; margin: 0 auto; }

  .page-header { margin-bottom: 2.5rem; }
  .page-header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    font-weight: 400;
    color: var(--text);
    letter-spacing: 3px;
    line-height: 1;
    background: linear-gradient(135deg, #f0f0f8 40%, var(--accent-bright));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .page-header p { font-size: 13px; color: var(--text-faint); margin-top: 6px; letter-spacing: 0.03em; }

  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 1.75rem;
  }
  .metric {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 1.2rem 1.4rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .metric::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-bright));
    opacity: 0.6;
  }
  .metric-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px;
  }
  .metric-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem; font-weight: 400; color: var(--text); line-height: 1;
    letter-spacing: 1px;
  }
  .metric-sub { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

  .toolbar {
    display: flex; gap: 10px; margin-bottom: 1rem;
    flex-wrap: wrap; align-items: center;
  }
  .search-wrap { position: relative; flex: 1; min-width: 160px; }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); color: var(--text-faint); pointer-events: none;
  }
  .search-wrap input {
    width: 100%; padding: 0 14px 0 38px; height: 40px;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); font-family: 'Inter', sans-serif;
    font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
  .search-wrap input::placeholder { color: var(--text-faint); }

  select.filter {
    height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); font-family: 'Inter', sans-serif;
    font-size: 13px; color: var(--text); padding: 0 12px; cursor: pointer; outline: none;
    transition: border-color 0.2s;
  }
  select.filter:focus { border-color: var(--accent); }
  select.filter option { background: var(--surface2); }

  .btn-add {
    height: 40px; padding: 0 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-bright));
    color: #fff; border: none; border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s; white-space: nowrap;
    box-shadow: 0 2px 12px rgba(124,58,237,0.35);
  }
  .btn-add:hover { opacity: 0.9; box-shadow: 0 4px 20px rgba(124,58,237,0.5); }
  .btn-add:active { transform: scale(0.97); }

  .sub-list { display: flex; flex-direction: column; gap: 8px; }

  .sub-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: var(--shadow); transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .sub-card:hover {
    border-color: rgba(124,58,237,0.4); transform: translateY(-2px);
    box-shadow: var(--shadow), 0 0 0 1px rgba(124,58,237,0.1), var(--glow);
  }

  .sub-icon {
    width: 46px; height: 46px; border-radius: 11px;
    background: var(--surface3); display: flex; align-items: center;
    justify-content: center; font-size: 22px; flex-shrink: 0; overflow: hidden;
    border: 1px solid var(--border);
  }
  .sub-icon img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; }
  .sub-icon .icon-fallback { font-size: 20px; }
  .sub-icon svg { width: 100%; height: 100%; border-radius: 10px; display: block; }
  .tile-brand-svg { width: 60px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .tile-brand-svg svg { width: 100%; height: 100%; border-radius: 4px; display: block; }

  .sub-info { flex: 1; min-width: 0; }
  .sub-name {
    font-size: 15px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub-meta { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .sub-payment { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

  /* Next payment row */
  .next-pay {
    display: flex; align-items: center; gap: 6px;
    margin-top: 5px; padding: 4px 8px;
    border-radius: 6px; font-size: 12px;
    width: fit-content;
  }
  .next-pay-label { font-weight: 600; opacity: 0.7; }
  .next-pay-value { font-weight: 500; }
  .next-pay-count {
    font-size: 11px; font-weight: 600; padding: 1px 6px;
    border-radius: 20px;
  }
  .next-pay-urgent  { background: rgba(248,113,113,0.1); color: var(--danger); }
  .next-pay-urgent .next-pay-count { background: var(--danger); color: #0a0a0f; font-weight: 700; }
  .next-pay-soon    { background: rgba(245,158,11,0.1); color: var(--warn); }
  .next-pay-soon .next-pay-count   { background: var(--warn); color: #0a0a0f; font-weight: 700; }
  .next-pay-ok      { background: rgba(52,211,153,0.08); color: var(--success); }
  .next-pay-ok .next-pay-count     { background: var(--success); color: #0a0a0f; font-weight: 700; }
  .next-pay-far     { background: var(--surface2); color: var(--text-muted); }
  .next-pay-far .next-pay-count    { background: var(--surface3); color: var(--text-muted); }
  .next-pay-paused  { background: var(--surface2); color: var(--text-faint); }

  .due-soon {
    display: inline-block; font-size: 11px; font-weight: 600;
    color: var(--warn); background: var(--warn-light);
    border-radius: 20px; padding: 1px 7px; margin-left: 6px;
  }

  .sub-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .sub-price { text-align: right; }
  .price-main { font-size: 15px; font-weight: 600; color: var(--text); }
  .price-per { font-size: 11px; color: var(--text-faint); margin-top: 1px; }

  .badge {
    font-size: 11px; font-weight: 600; padding: 3px 9px;
    border-radius: 20px; letter-spacing: 0.03em;
  }
  .badge-active { background: var(--success-light); color: var(--success); }
  .badge-trial { background: var(--warn-light); color: var(--warn); }
  .badge-paused { background: rgba(255,255,255,0.05); color: var(--text-faint); }
  .badge-cancelled { background: var(--danger-light); color: var(--danger); }

  .icon-btn, a.icon-btn {
    background: none; border: none; cursor: pointer; color: var(--text-faint);
    padding: 6px; border-radius: 7px; display: flex; align-items: center;
    transition: color 0.15s, background 0.15s; text-decoration: none;
  }
  .icon-btn:hover, a.icon-btn:hover { color: var(--accent-text); background: var(--accent-light); }

  .empty {
    text-align: center; padding: 3.5rem 1rem;
    color: var(--text-muted); font-size: 15px;
  }
  .empty svg { margin: 0 auto 12px; display: block; color: var(--text-faint); }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
    align-items: center; justify-content: center; z-index: 200; padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 18px; border: 1px solid var(--border-strong);
    padding: 1.75rem; width: 460px; max-width: 100%; max-height: 90vh;
    overflow-y: auto; box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(124,58,237,0.1);
  }
  .modal-title {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem;
    font-weight: 400; margin-bottom: 1.25rem; color: var(--text);
    letter-spacing: 2px;
  }

  /* Service picker */
  .service-picker { margin-bottom: 1rem; }
  .service-picker label {
    display: block; font-size: 12px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 8px;
  }
  .service-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 8px; max-height: 180px; overflow-y: auto;
    padding: 4px 2px;
  }
  .service-tile {
    display: flex; flex-direction: column; align-items: center;
    gap: 5px; padding: 8px 4px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface2);
    cursor: pointer; transition: all 0.15s; text-align: center;
  }
  .service-tile:hover { border-color: rgba(124,58,237,0.5); background: var(--accent-light); }
  .service-tile.selected { border-color: var(--accent-bright); background: var(--accent-light); box-shadow: 0 0 0 1px var(--accent); }
  .service-tile img { width: 32px; height: 32px; object-fit: contain; border-radius: 6px; }
  .service-tile .tile-emoji { font-size: 24px; line-height: 32px; }
  .service-tile span { font-size: 10px; color: var(--text-faint); line-height: 1.2; word-break: break-word; }
  .service-tile.selected span { color: var(--accent-text); font-weight: 600; }

  .or-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--text-faint); font-size: 12px; margin: 10px 0;
  }
  .or-divider::before, .or-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .form-row { margin-bottom: 14px; }
  .form-row label {
    display: block; font-size: 11px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 6px;
  }
  .form-row input, .form-row select {
    width: 100%; height: 40px; padding: 0 12px;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface2); font-family: 'Inter', sans-serif;
    font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-row input:focus, .form-row select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,0.15);
  }
  .form-row select option { background: var(--surface2); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .renew-display {
    height: 40px; padding: 0 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface3);
    font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-faint);
    display: flex; align-items: center;
  }

  .modal-actions {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border);
  }
  .btn-cancel {
    height: 38px; padding: 0 16px; background: none;
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-muted);
    cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .btn-cancel:hover { background: var(--surface2); color: var(--text); }
  .btn-save {
    height: 38px; padding: 0 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-bright));
    border: none; border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    color: #fff; cursor: pointer; transition: opacity 0.15s, box-shadow 0.15s;
    box-shadow: 0 2px 12px rgba(124,58,237,0.4);
  }
  .btn-save:hover { opacity: 0.9; box-shadow: 0 4px 20px rgba(124,58,237,0.55); }
  .btn-delete {
    height: 38px; padding: 0 16px; background: var(--danger-light); border: none;
    border-radius: var(--radius-sm); font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 600; color: var(--danger);
    cursor: pointer; margin-right: auto; transition: opacity 0.15s;
  }
  .btn-delete:hover { opacity: 0.8; }

  .section-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-faint);
    margin-bottom: 12px; padding-left: 2px;
  }

  @media (max-width: 560px) {
    .summary { grid-template-columns: 1fr 1fr; }
    .sub-right .badge { display: none; }
    .page-header h1 { font-size: 2.2rem; }
    .toolbar { gap: 8px; }
    select.filter { font-size: 12px; padding: 0 8px; }
    .sub-card { padding: 14px 14px; gap: 12px; }
    .next-pay { flex-wrap: wrap; }
  }
  @media (max-width: 380px) {
    .summary { grid-template-columns: 1fr; }
    .sub-right .sub-price { display: none; }
  }
  /* PWA safe areas for notched phones */
  @supports (padding: max(0px)) {
    body {
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
      padding-bottom: max(2rem, env(safe-area-inset-bottom));
      padding-top: max(2.5rem, env(safe-area-inset-top));
    }
  }
  /* Larger touch targets on mobile */
  @media (hover: none) {
    .icon-btn, a.icon-btn { padding: 10px; }
    .btn-add { height: 44px; }
    select.filter { height: 44px; }
    .search-wrap input { height: 44px; }
    .sub-card { padding: 16px 14px; }
  }
</style>
</head>
<body>
<!-- Install banner (Android/Chrome) -->
<div id="install-banner" style="display:none; position:fixed; bottom:0; left:0; right:0; z-index:999; background:linear-gradient(135deg,#1e1e2e,#141420); border-top:1px solid rgba(124,58,237,0.3); padding:14px 20px; padding-bottom:max(14px, env(safe-area-inset-bottom)); align-items:center; justify-content:space-between; gap:12px; box-shadow:0 -8px 32px rgba(0,0,0,0.5);">
  <div style="display:flex;align-items:center;gap:12px">
    <div style="width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">💳</div>
    <div>
      <div style="font-size:14px;font-weight:600;color:#f0f0f8">Add SubTracker to home screen</div>
      <div style="font-size:12px;color:#8888aa;margin-top:2px">Works offline · No account needed</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;flex-shrink:0">
    <button onclick="document.getElementById('install-banner').style.display='none'" style="height:36px;padding:0 14px;background:none;border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#8888aa;font-family:Inter,sans-serif;font-size:13px;cursor:pointer">Later</button>
    <button onclick="installApp()" style="height:36px;padding:0 16px;background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;border-radius:8px;color:white;font-family:Inter,sans-serif;font-size:13px;font-weight:600;cursor:pointer">Install</button>
  </div>
</div>

<!-- iOS install tip (shown once) -->
<div id="ios-tip" style="display:none; position:fixed; bottom:0; left:0; right:0; z-index:999; background:linear-gradient(135deg,#1e1e2e,#141420); border-top:1px solid rgba(124,58,237,0.3); padding:16px 20px; padding-bottom:max(16px, env(safe-area-inset-bottom)); text-align:center; box-shadow:0 -8px 32px rgba(0,0,0,0.5);">
  <div style="font-size:14px;font-weight:600;color:#f0f0f8;margin-bottom:6px">Add to your home screen</div>
  <div style="font-size:13px;color:#8888aa;line-height:1.5">Tap <strong style="color:#a855f7">Share</strong> <span style="font-size:16px">⎋</span> then <strong style="color:#a855f7">"Add to Home Screen"</strong></div>
  <button onclick="document.getElementById('ios-tip').style.display='none';localStorage.setItem('ios-tip-dismissed','1')" style="margin-top:12px;height:34px;padding:0 20px;background:none;border:1px solid rgba(255,255,255,0.15);border-radius:8px;color:#8888aa;font-family:Inter,sans-serif;font-size:13px;cursor:pointer">Got it</button>
</div>

<script>
// Show iOS tip once on Safari mobile
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isInStandaloneMode = window.navigator.standalone === true;
const dismissed = localStorage.getItem('ios-tip-dismissed');
if (isIOS && !isInStandaloneMode && !dismissed) {
  setTimeout(() => { document.getElementById('ios-tip').style.display = 'block'; }, 2000);
}
</script>

<div class="app">
  <div class="page-header">
    <h1>Subscriptions</h1>
    <p>Track your recurring bills in one place</p>
  </div>
  <div class="summary" id="summary"></div>
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Search subscriptions…" oninput="render()" />

  if (!startDateStr) return null;
  const start = new Date(startDateStr);
  const now = new Date();
  now.setHours(0,0,0,0);
  let next = new Date(start);
  if (cycle === 'yearly') {
    while (next <= now) { next.setFullYear(next.getFullYear() + 1); }
  } else {
    while (next <= now) { next.setMonth(next.getMonth() + 1); }
  }
  return next;
}

function daysUntil(dateObj) {
  if (!dateObj) return 9999;
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.ceil((dateObj - now) / 86400000);
}

function toMonthly(s) { return s.cycle === 'yearly' ? s.price / 12 : s.price; }

function fmtDate(d) {
  return d ? d.toLocaleDateString('en-AU', { month: 'short', day: 'numeric' }) : '—';
}

// ── Logo helpers ──────────────────────────────────────────────────────────
function getBrandSvg(name) {
  return BRAND_SVGS[name] || null;
}

function logoImg(name, emoji) {
  const svg = getBrandSvg(name);
  if (svg) return svg;
  return `<span class="icon-fallback">${emoji||'📦'}</span>`;
}

function getServiceInfo(name) {
  return SERVICE_LIBRARY.find(s => s.name.toLowerCase() === name.toLowerCase()) || null;
}

// ── Render ────────────────────────────────────────────────────────────────
function renderSummary() {
  const active = subs.filter(s => s.status === 'active' || s.status === 'trial');
  const monthly = active.reduce((a, s) => a + toMonthly(s), 0);
  const yearly = active.reduce((a, s) => a + (s.cycle === 'yearly' ? s.price : s.price * 12), 0);
  const dueSoon = active.filter(s => { const d = daysUntil(nextRenewalDate(s.startDate, s.cycle)); return d >= 0 && d <= 7; }).length;
  document.getElementById('summary').innerHTML = `
    <div class="metric">
      <div class="metric-label">Monthly cost</div>
      <div class="metric-value">$${monthly.toFixed(2)}</div>
      <div class="metric-sub">${active.length} active subscription${active.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="metric">
      <div class="metric-label">Annual cost</div>
      <div class="metric-value">$${Math.round(yearly).toLocaleString()}</div>
      <div class="metric-sub">excl. paused &amp; cancelled</div>
    </div>
    <div class="metric">
      <div class="metric-label">Renewing soon</div>
      <div class="metric-value">${dueSoon}</div>
      <div class="metric-sub">within 7 days</div>
    </div>`;
}

function render() {
  renderSummary();
  const q = document.getElementById('search-input').value.toLowerCase();
  const fs = document.getElementById('filter-status').value;
  const fc = document.getElementById('filter-cycle').value;
  const filtered = subs.filter(s =>
    (!q || s.name.toLowerCase().includes(q) || s.category.includes(q) || (s.paymentMethod||'').toLowerCase().includes(q)) &&
    (fs === 'all' || s.status === fs) &&
    (fc === 'all' || s.cycle === fc)
  );

  const sortBy = document.getElementById('sort-by')?.value || 'renewal';
  const STATUS_ORDER = { active: 0, trial: 1, paused: 2, cancelled: 3 };
  filtered.sort((a, b) => {
    if (sortBy === 'name') return a.name.localeCompare(b.name);
    if (sortBy === 'status') {
      const sd = (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9);
      return sd !== 0 ? sd : a.name.localeCompare(b.name);
    }
    if (sortBy === 'cost-asc') return toMonthly(a) - toMonthly(b);
    if (sortBy === 'cost-desc') return toMonthly(b) - toMonthly(a);
    // default: renewal date
    return daysUntil(nextRenewalDate(a.startDate, a.cycle)) - daysUntil(nextRenewalDate(b.startDate, b.cycle));
  });

  document.getElementById('list-label').textContent =
    filtered.length ? `${filtered.length} subscription${filtered.length !== 1 ? 's' : ''}` : '';

  const list = document.getElementById('sub-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      No subscriptions found
    </div>`;
    return;
  }
  list.innerHTML = filtered.map(s => {
    const renewDate = nextRenewalDate(s.startDate, s.cycle);
    const days = daysUntil(renewDate);
    const dueSoon = days >= 0 && days <= 7 ? `<span class="due-soon">${days === 0 ? 'Today' : `${days}d`}</span>` : '';
    const badge = { active:'badge-active', trial:'badge-trial', paused:'badge-paused', cancelled:'badge-cancelled' }[s.status] || 'badge-paused';
    const dateStr = fmtDate(renewDate);
    const priceHtml = s.cycle === 'yearly'
      ? `<div class="price-main">$${s.price.toFixed(2)}/yr</div><div class="price-per">$${toMonthly(s).toFixed(2)}/mo</div>`
      : `<div class="price-main">$${s.price.toFixed(2)}/mo</div>`;
    const payLine = s.paymentMethod ? `<div class="sub-payment">💳 ${s.paymentMethod}</div>` : '';

    // Next payment row
    let nextPayHtml = '';
    if (s.status === 'paused') {
      nextPayHtml = `<div class="next-pay next-pay-paused"><span class="next-pay-label">Next payment</span><span class="next-pay-value">—</span><span class="next-pay-count">paused</span></div>`;
    } else if (s.status === 'cancelled') {
      nextPayHtml = `<div class="next-pay next-pay-paused"><span class="next-pay-label">Next payment</span><span class="next-pay-value">—</span><span class="next-pay-count">cancelled</span></div>`;
    } else if (!s.startDate) {
      nextPayHtml = `<div class="next-pay next-pay-paused"><span class="next-pay-label">Next payment</span><span class="next-pay-value">—</span><span class="next-pay-count">no date set</span></div>`;
    } else {
      const amount = `$${s.price.toFixed(2)}`;
      let countLabel, countClass;
      if (days === 0) { countLabel = 'due today'; countClass = 'urgent'; }
      else if (days <= 3) { countLabel = `in ${days} day${days!==1?'s':''}`;  countClass = 'urgent'; }
      else if (days <= 7) { countLabel = `in ${days} days`; countClass = 'soon'; }
      else if (days <= 30) { countLabel = `in ${days} days`; countClass = 'ok'; }
      else { countLabel = `in ${days} days`; countClass = 'far'; }
      nextPayHtml = `<div class="next-pay next-pay-${countClass}">
        <span class="next-pay-label">Next payment</span>
        <span class="next-pay-value">${amount} · ${dateStr}</span>
        <span class="next-pay-count">${countLabel}</span>
      </div>`;
    }

    return `<div class="sub-card">
      <div class="sub-icon">${logoImg(s.name, s.emoji || EMOJI_MAP[s.category])}</div>
      <div class="sub-info">
        <div class="sub-name">${s.name}</div>
        <div class="sub-meta">${s.category}</div>
        ${payLine}
        ${nextPayHtml}
        ${s.notes ? `<div class="sub-meta" style="font-style:italic;color:var(--text-faint);margin-top:3px">${s.notes}</div>` : ''}
      </div>
      <div class="sub-right">
        <div class="sub-price">${priceHtml}</div>
        <span class="badge ${badge}">${s.status}</span>
        <button class="icon-btn" onclick="openEdit(${s.id})" title="Edit">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        ${s.url ? `<a class="icon-btn" href="${s.url}" target="_blank" rel="noopener" title="Open website">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ── Modal ─────────────────────────────────────────────────────────────────
function openAdd() { editId = null; selectedService = null; showModal(); }
function openEdit(id) { editId = id; selectedService = null; showModal(subs.find(s => s.id === id)); }

function serviceTiles() {
  return SERVICE_LIBRARY.map((svc, i) => {
    const svg = BRAND_SVGS[svc.name];
    const iconEl = svg
      ? `<div class="tile-brand-svg">${svg}</div>`
      : `<span class="tile-emoji">${svc.emoji}</span>`;
    return `<div class="service-tile" data-idx="${i}" onclick="selectService(${i})">${iconEl}<span>${svc.name}</span></div>`;
  }).join('');
}

function selectService(idx) {
  selectedService = idx;
  document.querySelectorAll('.service-tile').forEach((t,i) => t.classList.toggle('selected', i===idx));
  const svc = SERVICE_LIBRARY[idx];
  if (svc.name !== 'Custom…') {
    const nameEl = document.getElementById('f-name');
    if (nameEl && !nameEl.value) nameEl.value = svc.name;
    const catEl = document.getElementById('f-cat');
    if (catEl) catEl.value = svc.category;
    const urlEl = document.getElementById('f-url');
    if (urlEl && !urlEl.value && svc.url) urlEl.value = svc.url;
  }
  const nameEl = document.getElementById('f-name');
  if (nameEl) nameEl.focus();
}

function updateRenewPreview() {
  const startDate = document.getElementById('f-start')?.value;
  const cycle = document.getElementById('f-cycle')?.value || 'monthly';
  const el = document.getElementById('renew-preview');
  if (!el) return;
  if (!startDate) { el.textContent = 'Enter start date to calculate'; return; }
  const next = nextRenewalDate(startDate, cycle);
  const days = daysUntil(next);
  el.textContent = next ? `${fmtDate(next)} (in ${days} day${days!==1?'s':''})` : '—';
}

function showModal(s = {}) {
  // pre-select service tile if editing
  let preSelectedIdx = -1;
  if (s.logo) {
    preSelectedIdx = SERVICE_LIBRARY.findIndex(sv => sv.logo === s.logo);
  }

  document.getElementById('modal').innerHTML = `
    <div class="modal-title">${editId ? 'Edit subscription' : 'Add subscription'}</div>

    <div class="service-picker">
      <label>Quick-pick a service</label>
      <div class="service-grid">${serviceTiles()}</div>
    </div>

    <div class="or-divider">or enter manually</div>

    <div class="form-row"><label>Name</label><input id="f-name" type="text" value="${s.name||''}" placeholder="e.g. Netflix" autocomplete="off" /></div>

    <div class="form-grid">
      <div class="form-row"><label>Price ($)</label><input id="f-price" type="number" min="0" step="0.01" value="${s.price||''}" placeholder="9.99" /></div>
      <div class="form-row"><label>Billing cycle</label>
        <select id="f-cycle" onchange="updateRenewPreview()">
          <option value="monthly" ${s.cycle==='monthly'||!s.cycle?'selected':''}>Monthly</option>
          <option value="yearly" ${s.cycle==='yearly'?'selected':''}>Yearly</option>
        </select>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-row"><label>Category</label>
        <select id="f-cat">
          ${CATEGORIES.map(c=>`<option value="${c}" ${s.category===c?'selected':''}>${EMOJI_MAP[c]} ${c[0].toUpperCase()+c.slice(1)}</option>`).join('')}
        </select>
      </div>
      <div class="form-row"><label>Status</label>
        <select id="f-status">
          <option value="active" ${s.status==='active'||!s.status?'selected':''}>Active</option>
          <option value="trial" ${s.status==='trial'?'selected':''}>Trial</option>
          <option value="paused" ${s.status==='paused'?'selected':''}>Paused</option>
          <option value="cancelled" ${s.status==='cancelled'?'selected':''}>Cancelled</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <label>Billing start date</label>
      <input id="f-start" type="date" value="${s.startDate||''}" oninput="updateRenewPreview()" />
    </div>
    <div class="form-row">
      <label>Next renewal <span style="font-weight:400;text-transform:none;letter-spacing:0">(auto-calculated)</span></label>
      <div class="renew-display" id="renew-preview">Enter start date to calculate</div>
    </div>

    <div class="form-row">
      <label>Payment method</label>
      <input id="f-payment" type="text" value="${s.paymentMethod||''}" placeholder="e.g. ANZ Visa, PayPal, Apple Pay" />
    </div>

    <div class="form-row"><label>Notes (optional)</label><input id="f-notes" type="text" value="${s.notes||''}" placeholder="e.g. Family plan" /></div>
    <div class="form-row"><label>Website / account URL (optional)</label><input id="f-url" type="url" value="${s.url||''}" placeholder="https://..." /></div>

    <div class="modal-actions">
      ${editId ? `<button class="btn-delete" onclick="deleteSub(${editId})">Delete</button>` : ''}
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveSub()">Save</button>
    </div>`;

  // pre-select tile
  if (preSelectedIdx >= 0) {
    document.querySelectorAll('.service-tile')[preSelectedIdx]?.classList.add('selected');
    selectedService = preSelectedIdx;
  }

  updateRenewPreview();
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('f-name').focus();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  selectedService = null;
}

function saveSub() {
  const name = document.getElementById('f-name').value.trim();
  const price = parseFloat(document.getElementById('f-price').value);
  if (!name || isNaN(price) || price < 0) { alert('Please enter a valid name and price.'); return; }

  // resolve emoji & url
  let emoji = null;
  if (selectedService !== null) {
    const svc = SERVICE_LIBRARY[selectedService];
    if (svc) emoji = svc.emoji;
  } else if (editId) {
    emoji = subs.find(s => s.id === editId)?.emoji || null;
  }
  if (!emoji) {
    const match = getServiceInfo(name);
    if (match) emoji = match.emoji;
  }
  // auto-match url by name if none entered
  const urlVal = document.getElementById('f-url').value.trim();
  let resolvedUrl = urlVal;
  if (!resolvedUrl) {
    const match = getServiceInfo(name);
    if (match) resolvedUrl = match.url || '';
  }

  const sub = {
    id: editId || nextId++,
    name, price, emoji,
    cycle: document.getElementById('f-cycle').value,
    category: document.getElementById('f-cat').value,
    status: document.getElementById('f-status').value,
    startDate: document.getElementById('f-start').value,
    url: resolvedUrl,
    paymentMethod: document.getElementById('f-payment').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
  };
  subs = editId ? subs.map(s => s.id === editId ? sub : s) : [...subs, sub];
  save(); closeModal(); render();
}

function deleteSub(id) {
  if (!confirm('Delete this subscription?')) return;
  subs = subs.filter(s => s.id !== id);
  save(); closeModal(); render();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
render();
</script>
<script>
// ── PWA Service Worker ─────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'subtracker-v1';
    const FONTS = [
      'https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap'
    ];
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(FONTS).catch(()=>{})));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys =>
        Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
      ));
      self.clients.claim();
    });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(cached => cached || fetch(e.request).catch(() =>
          new Response('Offline', { status: 503 })
        ))
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}

// ── Install banner ─────────────────────────────────────────────────────────
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  const banner = document.getElementById('install-banner');
  if (banner) banner.style.display = 'flex';
});
window.addEventListener('appinstalled', () => {
  const banner = document.getElementById('install-banner');
  if (banner) banner.style.display = 'none';
});
function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
  }
}
</script>
